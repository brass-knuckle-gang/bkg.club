name: Deploy

on:
  push:
    branches: [main]
  # Hourly: each run looks up only the members due for a QRZ recheck (every
  # member within 24 h) and skips the upload when the site would not change.
  # GitHub drops scheduled runs under load, so blackpearl also dispatches
  # hourly with skip_unchanged; the cron is the backup.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      skip_unchanged:
        description: Skip the deploy when the built site matches the live one
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Keep environment-scoped QRZ secrets available, as in the original job.
    environment: github-pages
    outputs:
      artifact_name: ${{ steps.revision.outputs.artifact_name }}
      changed: ${{ steps.decide.outputs.changed }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record fixed build revision
        id: revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "artifact_name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Install image validation dependency
        run: python3 -m pip install -r requirements-build.txt

      - name: Check offline fixtures
        run: python3 -m unittest discover -s tests -v

      - name: Fetch and validate one public roster snapshot
        env:
          ROSTER_EXPORT_URL: ${{ secrets.ROSTER_EXPORT_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/bkg-build"
          python3 scripts/fetch-roster.py --output "$RUNNER_TEMP/bkg-build/roster.json" > "$RUNNER_TEMP/bkg-build/roster-record.json"
          cat "$RUNNER_TEMP/bkg-build/roster-record.json"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/bkg-build/source-sha.txt"

      # Only sanitized, identity/QTH-bound data is reused. No Sheets or raw
      # QRZ cache can become a membership fallback or enter the Pages output.
      - name: Restore sanitized enrichment
        id: enrichment-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bkg-build/enrichment
          key: bkg-enrichment-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bkg-enrichment-v1-

      - name: Refresh separate photo and geographic enrichment
        env:
          QRZ_USERNAME: ${{ secrets.QRZ_USERNAME }}
          QRZ_PASSWORD: ${{ secrets.QRZ_PASSWORD }}
        run: |
          python3 scripts/refresh-qrz.py \
            --roster-json "$RUNNER_TEMP/bkg-build/roster.json" \
            --enrichment-dir "$RUNNER_TEMP/bkg-build/enrichment" \
            --photo-overrides images/photo-overrides.json \
            --max-age-hours 24 --interval-hours 1 --workers 4 \
            --require-usable

      - name: Build roster from the saved snapshot
        run: |
          python3 scripts/build-roster.py --source json \
            --roster-json "$RUNNER_TEMP/bkg-build/roster.json" \
            --enrichment-dir "$RUNNER_TEMP/bkg-build/enrichment" \
            --output-dir dist

      - name: Validate public build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate-site.py --source json dist
          cmp "$RUNNER_TEMP/bkg-build/source-sha.txt" <(printf '%s\n' "$GITHUB_SHA")
          python3 - <<'PY_CHECK'
          import json, os
          from pathlib import Path
          snapshot = Path(os.environ["RUNNER_TEMP"]) / "bkg-build/roster.json"
          assert json.loads(snapshot.read_text()) == json.loads(Path("dist/data/v1/roster.json").read_text())
          PY_CHECK

      - name: Fingerprint the public build
        id: fingerprint
        run: echo "value=$(python3 scripts/site-fingerprint.py dist)" >> "$GITHUB_OUTPUT"

      # The newest saved fingerprint is the live site's, since one is saved
      # only after a successful deploy.
      - name: Restore the last deployed fingerprint
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/deployed-fingerprint
          key: bkg-deployed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bkg-deployed-v1-

      - name: Skip routine deploys that would not change the site
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SKIP_UNCHANGED: ${{ inputs.skip_unchanged }}
          CURRENT: ${{ steps.fingerprint.outputs.value }}
        run: |
          previous="$(cat "$RUNNER_TEMP/deployed-fingerprint/fingerprint.txt" 2>/dev/null || true)"
          if { [ "$EVENT" = schedule ] || [ "$SKIP_UNCHANGED" = true ]; } && [ "$previous" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Site unchanged since the last deploy; skipping upload and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pair the exact reviewed input and sanitized cache with the immutable
      # Pages archive for inspection and future cache recovery (30 days).
      - name: Retain reviewed snapshot and sanitized enrichment
        if: steps.decide.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bkg-build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bkg-build
          retention-days: 30
          if-no-files-found: error

      - uses: actions/configure-pages@v6
        if: steps.decide.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.changed == 'true'
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: dist
          retention-days: 30

      - name: Save validated sanitized enrichment
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bkg-build/enrichment
          key: ${{ steps.enrichment-cache.outputs.cache-primary-key }}

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

      - name: Record the deployed fingerprint
        env:
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          mkdir -p "$RUNNER_TEMP/deployed-fingerprint"
          printf '%s\n' "$FINGERPRINT" > "$RUNNER_TEMP/deployed-fingerprint/fingerprint.txt"

      # Losing this only costs one redundant deploy on the next scheduled run.
      - name: Save the deployed fingerprint
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/deployed-fingerprint
          key: bkg-deployed-v1-${{ github.run_id }}-${{ github.run_attempt }}

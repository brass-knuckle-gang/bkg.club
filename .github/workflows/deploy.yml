name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Keep environment-scoped QRZ secrets available, as in the original job.
    environment: github-pages
    outputs:
      artifact_name: ${{ steps.revision.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record fixed build revision
        id: revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "artifact_name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Check offline fixtures
        run: python3 -m unittest discover -s tests -v

      # Mugshots are gitignored; keep them between builds.
      # Unchanged photos skip download; failed lookups reuse them.
      - name: Restore mugshots
        uses: actions/cache@v4
        with:
          path: images/mugshots
          key: mugshots-${{ github.run_id }}
          restore-keys: |
            mugshots-

      - name: Build roster
        env:
          QRZ_USERNAME: ${{ secrets.QRZ_USERNAME }}
          QRZ_PASSWORD: ${{ secrets.QRZ_PASSWORD }}
        run: python3 scripts/build-roster.py --output-dir dist

      - name: Validate public build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate-site.py dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: dist
          retention-days: 30

      # Persist QRZ lookups as the fallback for failed lookups.
      # The artifact is already fixed. Rebase only a clean cache worktree;
      # never pull/rebase the checkout that generated the public files.
      # A persistence failure must not block the validated deployment.
      # GITHUB_TOKEN pushes and [skip ci] prevent a deployment loop.
      - name: Commit refreshed QRZ cache
        continue-on-error: true
        run: |
          if git diff --quiet -- qrz-cache.json; then
            echo "QRZ cache unchanged"
            exit 0
          fi
          cache_worktree="$RUNNER_TEMP/qrz-cache-persistence"
          git worktree add --detach "$cache_worktree" "$GITHUB_SHA"
          cp qrz-cache.json "$cache_worktree/qrz-cache.json"
          git -C "$cache_worktree" config user.name "github-actions[bot]"
          git -C "$cache_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$cache_worktree" add qrz-cache.json
          git -C "$cache_worktree" commit -m "Refresh QRZ cache [skip ci]"
          git -C "$cache_worktree" fetch origin main
          git -C "$cache_worktree" rebase FETCH_HEAD
          git -C "$cache_worktree" push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

name: Deploy

on:
  push:
    branches: [main]
  # Hourly publication of administration-owned roster data and photos.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      skip_unchanged:
        description: Skip the upload when the site would not change, as scheduled runs do.
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: github-pages
    outputs:
      artifact_name: ${{ steps.revision.outputs.artifact_name }}
      changed: ${{ steps.decide.outputs.changed }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    env:
      # Set ROSTER_LAYOUT to "classic" to restore the original card wall.
      ROSTER_LAYOUT: ${{ vars.ROSTER_LAYOUT || 'list' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record fixed build revision
        id: revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "artifact_name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Install image validation dependency
        run: python3 -m pip install -r requirements-build.txt

      - name: Check offline fixtures
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check offline browser scripts
        run: node --test tests/*.test.cjs

      - name: Restore the roster snapshot cache
        id: roster-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bkg-build/roster-cache-v2
          key: bkg-roster-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bkg-roster-v2-

      - name: Fetch and validate one public roster snapshot
        id: snapshot
        env:
          ROSTER_EXPORT_URL: ${{ secrets.ROSTER_EXPORT_V2_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/bkg-build"
          python3 scripts/fetch-roster.py \
            --cache-dir "$RUNNER_TEMP/bkg-build/roster-cache-v2" \
            --output "$RUNNER_TEMP/bkg-build/roster.json" > "$RUNNER_TEMP/bkg-build/roster-record.json"
          cat "$RUNNER_TEMP/bkg-build/roster-record.json"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/bkg-build/source-sha.txt"

      - name: Restore immutable administration photos
        id: public-assets-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bkg-build/public-assets
          key: bkg-public-assets-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bkg-public-assets-v2-

      - name: Fetch and verify administration photos from the saved snapshot
        env:
          ROSTER_EXPORT_URL: ${{ secrets.ROSTER_EXPORT_V2_URL }}
        run: |
          python3 scripts/fetch-public-assets.py \
            --roster-json "$RUNNER_TEMP/bkg-build/roster.json" \
            --asset-dir "$RUNNER_TEMP/bkg-build/public-assets"

      - name: Build roster from the saved snapshot
        env:
          ROSTER_EXPORT_URL: ${{ secrets.ROSTER_EXPORT_V2_URL }}
        run: |
          python3 scripts/build-roster.py \
            --roster-json "$RUNNER_TEMP/bkg-build/roster.json" \
            --asset-dir "$RUNNER_TEMP/bkg-build/public-assets" \
            --output-dir dist

      - name: Validate public build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate-site.py dist
          cmp "$RUNNER_TEMP/bkg-build/source-sha.txt" <(printf '%s\n' "$GITHUB_SHA")
          python3 - <<'PY_CHECK'
          import json, os
          from pathlib import Path
          snapshot = Path(os.environ["RUNNER_TEMP"]) / "bkg-build/roster.json"
          assert json.loads(snapshot.read_text(encoding="utf-8")) == json.loads(Path("dist/data/v2/roster.json").read_text(encoding="utf-8"))
          PY_CHECK

      - name: Fingerprint the public build
        id: fingerprint
        run: echo "value=$(python3 scripts/site-fingerprint.py dist)" >> "$GITHUB_OUTPUT"

      # The newest saved fingerprint is written by a successful deploy.
      # The cache prefix predates V2 and still tracks the live site.
      - name: Restore the last deployed fingerprint
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/deployed-fingerprint
          key: bkg-deployed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bkg-deployed-v1-

      - name: Skip scheduled deploys that would not change the site
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SKIP_UNCHANGED: ${{ inputs.skip_unchanged }}
          CURRENT: ${{ steps.fingerprint.outputs.value }}
        run: |
          previous="$(cat "$RUNNER_TEMP/deployed-fingerprint/fingerprint.txt" 2>/dev/null || true)"
          if { [ "$EVENT" = schedule ] || [ "$SKIP_UNCHANGED" = true ]; } && [ "$previous" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Site unchanged since the last deploy; skipping upload and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Keep the exact source, publication projection, exclusion report and
      # sanitized inputs, including exclusions during an unchanged deploy.
      - name: Retain reviewed snapshot and validated public inputs
        if: steps.decide.outputs.changed == 'true' || steps.snapshot.outputs.excluded_members != '0'
        uses: actions/upload-artifact@v7
        with:
          name: bkg-build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bkg-build
          retention-days: 30
          if-no-files-found: error

      - uses: actions/configure-pages@v6
        if: steps.decide.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.changed == 'true'
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: dist
          retention-days: 30

      - name: Save the validated roster snapshot cache
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bkg-build/roster-cache-v2
          key: ${{ steps.roster-cache.outputs.cache-primary-key }}

      - name: Save validated immutable administration photos
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bkg-build/public-assets
          key: ${{ steps.public-assets-cache.outputs.cache-primary-key }}

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

      - name: Record the deployed fingerprint
        env:
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          mkdir -p "$RUNNER_TEMP/deployed-fingerprint"
          printf '%s\n' "$FINGERPRINT" > "$RUNNER_TEMP/deployed-fingerprint/fingerprint.txt"

      # Losing this only costs one redundant deploy on the next scheduled run.
      - name: Save the deployed fingerprint
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/deployed-fingerprint
          key: bkg-deployed-v1-${{ github.run_id }}-${{ github.run_attempt }}
